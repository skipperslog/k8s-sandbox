apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hamsa-ledger
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/skipperslog/k8s-sandbox.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
